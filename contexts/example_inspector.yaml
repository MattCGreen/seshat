# Example Governance Context
# ===========================
# This is a generic example for the public repo. Copy to
# ~/.seshat/contexts/<your_context>.yaml and customize.
# NEVER push role-specific or employer-specific contexts.

role: Inspector
authority_level: L3
active_frameworks:
  - eu_ai_act:
      - "Article 5: Prohibited Practices"
      - "Article 9: Risk Management System"
  - nist_ai_rmf:
      - "GOVERN: Establish context"
      - "MAP: Identify risks"
      - "MEASURE: Assess performance"
      - "MANAGE: Mitigate risks"
  - iso_42001:
      - "Clause 8.2: AI impact assessment"
      - "Clause 8.3: Data management"
      - "Clause 8.4: Operational controls"
  - colorado_ai_act:
      - "SB 24-205: Consequential decisions"
delegation_limits:
  max_agent_spawn: 2
  allowed_tools: []
  # These are real Hermes Agent tool names. Seshat blocks them via
  # the context-derived tool_blocklist rule. Customize for your needs.
  # The example blocks high-risk tools that can execute arbitrary code
  # or spawn autonomous agents. Uncomment others as needed.
  blocked_tools:
    - execute_code
    - delegate_task
    # - terminal
    # - browser_navigate
    # - browser_click
    # - browser_type
    # - write_file
    # - patch
compliance_posture:
  audit_level: detailed
  fail_closed: true
  pii_redaction: true
